name: Build R7800 NSS Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone ImmortalWrt Source (Verified Repo)
      run: |
        # 克隆真实存在的 ImmortalWrt 官方源码仓库
        git clone -b master https://github.com/immortalwrt/immortalwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate R7800 NSS Config
      run: |
        cd openwrt
        cat <<EOF > .config
        # 针对 Netgear R7800 目标设备
        CONFIG_TARGET_ipq806x=y
        CONFIG_TARGET_ipq806x_generic=y
        CONFIG_TARGET_ipq806x_generic_DEVICE_netgear_r7800=y

        # 启用高通 NSS 驱动和 ECM 加速模块
        CONFIG_PACKAGE_kmod-qca-nss-drv=y
        CONFIG_PACKAGE_kmod-qca-nss-ecm=y
        CONFIG_PACKAGE_kmod-qca-nss-gmac=y
        CONFIG_PACKAGE_nss-firmware-ipq806x=y

        # LuCI Web 后台
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        EOF

        make defconfig

    - name: Download & Compile
      run: |
        cd openwrt
        make download -j8
        make -j$(nproc) || make -j1 V=s

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: R7800-NSS-Firmware
        path: |
          openwrt/bin/targets/ipq806x/generic/*r7800*factory.img
          openwrt/bin/targets/ipq806x/generic/*r7800*sysupgrade.bin
