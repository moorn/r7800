name: Build Netgear R7800 Working NSS Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Freeing Up Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install Dependencies
      run: |
        sudo timedatectl set-timezone "Asia/Shanghai"
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

    - name: Clone Verified IPQ806x NSS Source
      run: |
        # 使用专门为 IPQ806x 修复了 NSS 驱动的高通适配源码库（Linux 5.15/6.1 LTS 专修版）
        git clone https://github.com/ACwifidude/openwrt-ipq806x.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Generate Working .config
      run: |
        cd openwrt
        cat <<EOF > .config
        # 1. 目标设备设置 (Netgear R7800)
        CONFIG_TARGET_ipq806x=y
        CONFIG_TARGET_ipq806x_generic=y
        CONFIG_TARGET_ipq806x_generic_DEVICE_netgear_r7800=y

        # 2. NSS 硬件加速核心驱动 (必选)
        CONFIG_PACKAGE_kmod-qca-nss-drv=y
        CONFIG_PACKAGE_kmod-qca-nss-ecm=y
        CONFIG_PACKAGE_kmod-qca-nss-gmac=y
        CONFIG_PACKAGE_nss-firmware-ipq806x=y
        CONFIG_PACKAGE_kmod-qca-nss-crypto=y

        # 3. LuCI 界面与加速控制组件
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-app-turboacc=y
        CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NSS=y

        # 4. 最佳无线驱动配合 (QCA9984)
        CONFIG_PACKAGE_kmod-ath10k-ct=y
        CONFIG_PACKAGE_ath10k-firmware-qca9984-ct=y
        EOF

        # 补全默认依赖
        make defconfig

    - name: Download Sources
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile
      run: |
        cd openwrt
        echo "Building R7800 NSS Firmware..."
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: Netgear-R7800-NSS-Tested-Firmware
        path: |
          openwrt/bin/targets/ipq806x/generic/*r7800*factory.img
          openwrt/bin/targets/ipq806x/generic/*r7800*sysupgrade.bin
